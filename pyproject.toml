[project]
name = "kingdom-rush-evo-agent"
version = "0.3.0"
description = "Modular, stable evolutionary RL scaffold for Kingdom Rush"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "mss>=9.0",
  "pyautogui>=0.9.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
kr-train = "kr_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
